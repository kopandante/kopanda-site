<html>
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор паролей</title>
<meta name="description" content="Генератор паролей" />
<meta name="keywords" content="Генератор паролей" />
<meta name="author" content="panda@kopanda.ru" />

<style>
html, input {
	font-family: 'Open Sans';
	font-weight: 300;
}
html {
	text-transform: uppercase
}
form {
	display: block;
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
}
form *:not(a) {
	margin: 1em auto;
	width: 100%;
	
}
input, a {
	display: block;
	text-align: center;
}
a {
	border-radius: 0.3em;
	text-decoration: none;
	padding: .3em 0.5em;
    box-shadow: 0 3px 10px rgba(0,0,0,0.13),0 3px 10px rgba(0,0,0,0.06);
}

</style>
</head>
<body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
<script>
$(document).ready(function() {
//—крипт генерации паролей
    function str_rand() {
        var result       = '';
        var words        = '0123456789qwertyuiopasdfghjklzxcvbnmQWERTYUIOPASDFGHJKLZXCVBNM';
        var max_position = words.length - 1;
		var length = $('#length').val();
            for( i = 0; i < length; ++i ) {
                position = Math.floor ( Math.random() * max_position );
                result = result + words.substring(position, position + 1);
            }
        return result;
    }
    $('.generatePassword').click(function() {
        document.getElementById('password').setAttribute('type', 'text');
        $('#password').attr('value', str_rand()).select();
    });
});
</script>
<form oninput="amount.value=length.value">
	Длина пароля:&#32;<output name="amount" for="length">10</output>&nbsp;символов
	<input type="range" id="length" name="length" min="6" max="20" value="10">
	<input type="text" name="password" id="password" />
	<a href="#" class="generatePassword">Cгенерировать</a>
</form>
</body>
</html>
